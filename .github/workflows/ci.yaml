name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  AI_ENABLED: "false"

jobs:
  application:
    name: Application checks and Chromium E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install the pinned package manager and dependencies
        run: |
          npm install --global pnpm@11.7.0
          pnpm install --frozen-lockfile
      - name: Verify the immutable source and destination initializer
        run: node scripts/verify-source-baseline.mjs
      - name: Verify the real Next.js Client and Server Component boundary
        run: node scripts/verify-client-marker-boundary.mjs
      - name: ESLint
        run: pnpm lint
      - name: Production dependency advisory audit
        run: pnpm audit --prod --audit-level=low
      - name: TypeScript
        run: pnpm typecheck
      - name: Deterministic unit tests (AI mocks)
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Chromium E2E against the built application
        run: pnpm exec playwright test
      - name: Repeat the original stress gate on macOS without retries
        if: runner.os == 'macOS'
        run: pnpm exec playwright test tests/e2e/workspace.spec.ts --grep 'survives the full entity-limit project' --repeat-each=3 --retries=0 --output=test-results/macos-repeat
      - name: Diagnose first attempts with CPU traces (not performance acceptance)
        if: ${{ !cancelled() && (runner.os == 'macOS' || runner.os == 'Windows') }}
        # Instrumentation changes timing. This supplementary run cannot replace
        # or turn green either of the unprofiled acceptance steps above.
        continue-on-error: true
        env:
          BROWSER_DIAGNOSTICS: "1"
        run: pnpm exec playwright test tests/e2e/workspace.spec.ts --grep 'survives the full entity-limit project|Hybrid viewport adds pan navigation' --repeat-each=6 --retries=0 --trace=on --output=test-results/diagnostic
      - name: Upload browser failure evidence
        # A retry can make the job green while a real first-attempt failure
        # remains. Preserve that evidence as well as terminal failures.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: chromium-failure-evidence-${{ matrix.os }}
          path: |
            test-results/**/test-failed-*.png
            test-results/**/error-context.md
            test-results/**/trace.zip
            test-results/**/attachments/*.json
            test-results/**/worker-stress-metrics.json
            test-results/**/browser-events.json
            test-results/**/chromium-cpu-trace.json
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Production Docker integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install the verified Docker Compose version
        run: |
          compose_binary="$HOME/.docker/cli-plugins/docker-compose"
          mkdir -p "$(dirname "$compose_binary")"
          curl --fail --location --retry 3 https://github.com/docker/compose/releases/download/v5.5.1/docker-compose-linux-x86_64 --output "$compose_binary"
          printf '%s  %s\n' 'db1889184726840f75c4f9c001048430d4f25b3be3cb084d3ddd762bc0aed576' "$compose_binary" | sha256sum --check
          chmod 755 "$compose_binary"
          docker compose version
      - name: Validate both Compose configurations
        run: |
          docker compose config --quiet
          docker compose -f compose.dev.yaml config --quiet
      - name: Build and start a clean production image
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: HTTP, browser-route and no-key API smoke
        run: node scripts/docker-smoke.mjs http://127.0.0.1:3000
      - name: Verify runtime isolation and image contents
        run: |
          docker compose exec -T web node --input-type=module < scripts/docker-runtime-check.mjs
          docker image inspect echo-canvas-web:local --format 'Image size: {{.Size}} bytes; user: {{.Config.User}}; exposed ports: {{json .Config.ExposedPorts}}'
      - name: Verify graceful shutdown
        run: |
          container_id=$(docker compose ps -q web)
          docker compose stop --timeout 30 web
          exit_code=$(docker inspect --format '{{.State.ExitCode}}' "$container_id")
          # Next 16.3.8 exits 143 after its SIGTERM cleanup (128 + signal 15).
          case "$exit_code" in
            0|143) ;;
            *) echo "Unexpected container shutdown exit code: $exit_code"; exit 1 ;;
          esac
          test "$(docker inspect --format '{{.State.OOMKilled}}' "$container_id")" = false
      - name: Container logs and cleanup
        if: always()
        run: |
          docker compose logs --no-color
          docker compose down
